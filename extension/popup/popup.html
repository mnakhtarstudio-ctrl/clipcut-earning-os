<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClipCut OS</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand">
      <img src="../icons/icon32.png" alt="" width="24" height="24" />
      <div>
        <strong>ClipCut OS</strong>
        <span id="operator" class="muted">Manager</span>
      </div>
    </div>
    <div id="badge-pill" class="pill">—</div>
  </header>

  <section class="stats">
    <div class="stat"><span class="n" id="todayCount">0</span><span class="l">Today</span></div>
    <div class="stat"><span class="n" id="remaining">0</span><span class="l">Left</span></div>
    <div class="stat"><span class="n" id="activeCamp">0</span><span class="l">Campaigns</span></div>
    <div class="stat"><span class="n" id="totalNet">$0</span><span class="l">Net</span></div>
  </section>

  <nav class="tabs">
    <button class="tab active" data-tab="log">Log clip</button>
    <button class="tab" data-tab="campaigns">Campaigns</button>
    <button class="tab" data-tab="brief">Brief</button>
  </nav>

  <main>
    <section id="tab-log" class="panel active">
      <label>Campaign
        <select id="campaignSelect"></select>
      </label>
      <label>Clip title / hook
        <input id="title" type="text" placeholder="The moment he said this…" />
      </label>
      <div class="row">
        <label>Viral score
          <input id="viralScore" type="number" min="0" max="100" value="75" />
        </label>
        <label>CPM $
          <input id="cpm" type="number" step="0.05" min="0" value="1.25" />
        </label>
      </div>
      <label>Post link
        <input id="postLink" type="url" placeholder="https://tiktok.com/…" />
      </label>
      <div class="row">
        <label>Platform
          <select id="platform">
            <option>TikTok</option>
            <option>Instagram</option>
            <option>YouTube</option>
            <option>X</option>
          </select>
        </label>
        <label>Account
          <input id="account" type="text" />
        </label>
      </div>
      <button id="btnLog" class="primary">Log clip → tracker</button>
      <p id="logMsg" class="msg"></p>
    </section>

    <section id="tab-campaigns" class="panel">
      <div id="campaignList" class="list"></div>
      <details>
        <summary>Add / score campaign</summary>
        <label>Name <input id="cName" type="text" /></label>
        <div class="row">
          <label>CPM <input id="cCpm" type="number" step="0.05" value="1.5" /></label>
          <label>Budget $ <input id="cBudget" type="number" value="5000" /></label>
        </div>
        <div class="row">
          <label>Clippers <input id="cClippers" type="number" value="40" /></label>
          <label>Min views <input id="cMin" type="number" value="1000" /></label>
        </div>
        <button id="btnAddCamp" class="primary">Add + score</button>
        <p id="campMsg" class="msg"></p>
      </details>
    </section>

    <section id="tab-brief" class="panel">
      <ol class="brief">
        <li><strong>Research</strong> — open intel boards</li>
        <li><strong>Join</strong> — priority campaigns only (score ≥ 38)</li>
        <li><strong>ClipCut</strong> — keep score ≥ <span id="minScore">72</span></li>
        <li><strong>Post</strong> TikTok → submit Whop → log here</li>
        <li><strong>Update</strong> views when approved</li>
      </ol>
      <div class="btn-row">
        <button id="btnWhop" class="ghost">Whop</button>
        <button id="btnClipCut" class="ghost">ClipCut</button>
        <button id="btnIntel" class="ghost">Intel</button>
      </div>
      <div class="btn-row">
        <button id="btnExport" class="ghost">Export CSV</button>
        <button id="btnOptions" class="ghost">Settings</button>
      </div>
      <ul id="recentClips" class="list small"></ul>
    </section>
  </main>

  <footer>
    <span class="muted">Background worker active</span>
    <span id="ping" class="muted">…</span>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
