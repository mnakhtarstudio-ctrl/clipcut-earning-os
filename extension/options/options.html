<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ClipCut OS Settings</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #e5e7eb; background: #0b1220; }
    body { max-width: 560px; margin: 32px auto; padding: 0 16px; }
    h1 { font-size: 20px; }
    label { display: block; margin: 12px 0; color: #9ca3af; font-size: 13px; }
    input, select { width: 100%; margin-top: 4px; padding: 10px; border-radius: 8px; border: 1px solid #1f2937; background: #111827; color: #e5e7eb; }
    button { margin-top: 16px; background: #22d3ee; color: #042f2e; border: 0; padding: 12px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    #msg { color: #34d399; min-height: 20px; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 16px; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>ClipCut OS Manager — Settings</h1>
  <p style="color:#9ca3af">Background alarms, targets, and fee math. Saved to chrome.storage.local.</p>
  <div class="card">
    <label>Operator name <input id="operatorName" /></label>
    <label>Default account <input id="defaultAccount" /></label>
    <div class="row">
      <label>Daily clip target <input id="dailyClipTarget" type="number" min="1" /></label>
      <label>Min viral score <input id="minViralScore" type="number" min="0" max="100" /></label>
    </div>
    <div class="row">
      <label>Platform fee % <input id="feePct" type="number" step="0.1" /></label>
      <label>Badge mode
        <select id="badgeMode">
          <option value="remaining">Clips remaining</option>
          <option value="pending">Pending approvals</option>
          <option value="off">Off</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label>Reminder hour (0-23) <input id="reminderHour" type="number" min="0" max="23" /></label>
      <label>Reminder minute <input id="reminderMinute" type="number" min="0" max="59" /></label>
    </div>
    <label><input id="notificationsEnabled" type="checkbox" /> Enable daily notification</label>
    <label>ClipCut URL <input id="clipcutUrl" /></label>
    <label>Whop URL <input id="whopUrl" /></label>
    <button id="save">Save settings</button>
    <p id="msg"></p>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
